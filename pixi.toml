[workspace]
name = "mole-tracker-agent-tools"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[dependencies]
python = "3.12.*"

[pypi-dependencies]
apm-cli = "==0.31.0"

[tasks]
setup-skills = "apm install --frozen --target agent-skills --no-policy"
audit-skills = "apm audit --ci --no-policy"
